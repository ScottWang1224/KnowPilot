{% from 'macros.html' import icon %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入工作平台 · KnowPilot</title>
  <link rel="stylesheet" href="/static/css/index.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body class="login-body" data-page="login">
  <main class="login-layout">
    <section class="login-form-panel" aria-labelledby="login-title">
      <div class="login-form-wrap">
        <span class="login-top-label">EMPLOYEE ACCESS</span>
        <h1 id="login-title">登入工作平台</h1>
        <p class="muted">請使用註冊時的電子信箱與密碼登入。</p>
        <div class="alert" role="alert" hidden></div>
        <form class="login-form" id="login-form" novalidate>
          <label for="email">電子信箱</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="username" placeholder="name@example.com" required autofocus>
          <label for="password">密碼</label>
          <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" placeholder="輸入你的登入密碼" required>
          <button type="submit" class="button button-primary">登入 {{ icon('arrow') }}</button>
        </form>
        <p class="login-help">還沒有帳號？<a class="text-link" href="/register">註冊新帳號</a></p>
        <div class="login-security">{{ icon('lock') }} 僅供授權員工使用</div>
      </div>
      <footer class="login-footer">KnowPilot AI Assistant · 虛構企業期初展示</footer>
    </section>
  </main>
</body>
</html>
