# 口語改寫題：用語刻意避開文件內的術語與代碼，測試檢索對員工實際說法的容忍度。
# 格式同 questions.yaml。P001～P010 由 Claude Code 撰寫；P011～P020 由使用者補寫。
# 每題 avoided 欄位列出刻意不用的文件用語，供檢查題目是否真的避開（評測不使用）。

- id: P001
  type: answerable
  asker_department: MFG
  question: 要進去穿全身包起來那套衣服的房間，門口那個吹風的地方要站多久？
  avoided: [風淋, 潔淨室, 無塵, 連身, CL-01, Class 1,000]
  expected_docs: [MFG-RULE-001]
  key_facts:
    - CL-01 塗布區（Class 1,000）風淋 30 秒
  must_not_reveal: []

- id: P002
  type: answerable
  asker_department: MFG
  question: 做顯示器保護膜那台機器，膜上出現一條一條的痕跡，現場可以先怎麼處理？
  avoided: [條紋, D01, CL-01, 狹縫, 插片清理, 硬塗膜]
  expected_docs: [MFG-SOP-009]
  key_facts:
    - CL-01 先插片清理，2 次無效停線拆解清潔並通報 PE
    - 二次過濾器壓差 1 小時內下降 0.05 MPa 以上視為濾芯破損
  must_not_reveal: []

- id: P003
  type: multi_doc
  asker_department: QA
  question: 去外縣市找客人，回來之後車票跟吃飯的錢要怎麼拿回來？
  avoided: [出差, 報支, 日支費, 交通費, 國內]
  expected_docs: [ADM-RULE-005, ADM-FORM-002]
  key_facts:
    - 返回後 10 個工作天內在人事系統報支
    - 日支費由系統依地區與天數計算，當日往返 400 元
    - 收據需有公司統一編號
  must_not_reveal: []

- id: P004
  type: answerable
  asker_department: MFG
  question: 老婆快要生了，公司給幾天讓我去醫院陪她？
  avoided: [陪產, 陪產檢, 假別]
  expected_docs: [ADM-RULE-003]
  key_facts:
    - 陪產檢及陪產假 7 天，全薪
    - 正職與約聘都適用
  must_not_reveal: []

- id: P005
  type: answerable
  asker_department: PE
  question: 天花板那些往下吹的送風機，裡面的濾網髒到什麼程度要換？
  avoided: [FFU, HEPA, 壓差, Pa]
  expected_docs: [PE-PLAN-002]
  key_facts:
    - 壓差 250 Pa 以上更換 HEPA
    - 製造部每週一記錄，通報後設備課 7 天內更換
  must_not_reveal: []

- id: P006
  type: answerable
  asker_department: RD
  question: 我們在開發的那款最硬的新膜，上次拿到產線上跑的結果怎樣？
  avoided: [HC-400, NP-2026-02, 試作, 試產, 4H]
  expected_docs: [RD-RPT-003]
  key_facts:
    - 750 mJ/cm² 且第 3 區 105 °C 的段落 5 片全部 4H
    - 捲曲 9 mm 超過目標 5 mm
  must_not_reveal: []

