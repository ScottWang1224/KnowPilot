{% extends 'base.html' %}{% block title %}文件中心{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">KNOWLEDGE CENTER</p><h1>文件中心</h1><p class="muted">查閱作業標準、內部規章與教育訓練文件。</p></div><span class="count-label"><span data-field="total"></span> 份可存取文件</span></div><form class="filter-bar" action="/documents" method="get"><div class="search-field">{{ icon('search') }}<label class="sr-only" for="q">搜尋文件</label><input id="q" name="q" type="search" placeholder="搜尋文件名稱、編號或摘要" maxlength="100"></div><label class="sr-only" for="category">文件分類</label><select id="category" name="category"><option value="">全部分類</option></select><button class="button button-primary" type="submit">搜尋</button><a class="text-link" href="/documents" data-show-filtered hidden>清除</a></form><div class="access-notice">{{ icon('lock') }} 此頁僅顯示符合你部門權限的已發布文件。</div><section class="panel document-list" aria-label="可存取文件" id="document-list"></section><div id="pagination"></div>
<template id="tpl-document"><a class="document-list-item" href=""><span class="document-icon">{{ icon('document') }}</span><div class="document-list-main"><div><span class="document-code" data-field="document_code"></span><span class="tag" data-field="category"></span></div><h2 data-field="title"></h2><p data-field="summary"></p><div class="document-meta"><span data-field="department"></span><span data-field="visibility"></span><span data-field="version"></span><time data-field="updated"></time></div></div>{{ icon('arrow') }}</a></template>
<template id="tpl-document-empty"><div class="empty-state">{{ icon('search') }}<h2>沒有符合條件的文件</h2><p>試試其他關鍵字，或返回全部可存取文件。</p><a class="text-link" href="/documents" data-show-filtered hidden>查看全部文件</a></div></template>{% endblock %}
