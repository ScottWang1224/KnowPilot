# ---------- answerable（20）----------
- id: Q001
  type: answerable
  asker_department: MFG
  question: CL-01 的 UV 燈管現在用到幾小時就要換？
  expected_docs: [MFG-SOP-001]
  acceptable_docs: [ANN:ecn-2026-011]
  key_facts:
    - 燈管累積 1,200 小時更換
    - 依據 ECN-2026-011
  must_not_reveal: []

- id: Q002
  type: answerable
  asker_department: MFG
  question: RF-25 快速篩檢出來幾克要停線？
  expected_docs: [MFG-SOP-010]
  key_facts:
    - 快速篩檢 RF-25 判定範圍 18–28 g/25mm
    - 低於 14.4 或高於 33.6 g/25mm 為 A 級，立即停線
    - 同一班第 3 次 B 級也要升 A 級停線
  must_not_reveal: []

- id: Q003
  type: answerable
  asker_department: MFG
